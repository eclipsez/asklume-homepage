<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AskLume</title>
    <style>
      .no-script {
        min-height: 100vh;
        color: #0d1638;
        background:
          radial-gradient(circle at 92% 6%, rgba(223, 95, 209, 0.11), transparent 24rem),
          radial-gradient(circle at 10% 20%, rgba(86, 111, 255, 0.1), transparent 28rem),
          #f7f8fc;
        font-family: "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        line-height: 1.65;
      }

      .no-script *,
      .no-script *::before,
      .no-script *::after {
        box-sizing: border-box;
      }

      .no-script a {
        color: #566fff;
        text-underline-offset: 0.2em;
      }

      .no-script__header,
      .no-script__main,
      .no-script__footer {
        width: min(calc(100% - 3rem), 70rem);
        margin-inline: auto;
      }

      .no-script__header {
        display: flex;
        align-items: baseline;
        padding-block: 1.25rem;
        gap: 0.65rem;
        border-bottom: 1px solid rgba(13, 22, 56, 0.1);
      }

      .no-script__brand {
        font-size: 1rem;
        font-weight: 800;
      }

      .no-script__subtitle,
      .no-script__description,
      .no-script li,
      .no-script__footer {
        color: #65708c;
      }

      .no-script__subtitle {
        font-size: 0.75rem;
      }

      .no-script__hero {
        max-width: 52rem;
        padding-block: clamp(4rem, 10vw, 7rem);
      }

      .no-script__eyebrow {
        margin: 0 0 0.75rem;
        color: #6857f2;
        font-size: 0.75rem;
        font-weight: 750;
        letter-spacing: 0.08em;
      }

      .no-script h1,
      .no-script h2,
      .no-script h3,
      .no-script p {
        margin-top: 0;
      }

      .no-script h1 {
        max-width: 48rem;
        margin-bottom: 1rem;
        font-size: clamp(2.25rem, 6vw, 4.25rem);
        letter-spacing: -0.045em;
        line-height: 1.12;
      }

      .no-script__description {
        max-width: 45rem;
        margin-bottom: 0;
        font-size: clamp(1rem, 2vw, 1.15rem);
      }

      .no-script__section {
        padding-block: 2.25rem;
        border-top: 1px solid rgba(13, 22, 56, 0.09);
      }

      .no-script h2 {
        margin-bottom: 1.25rem;
        font-size: clamp(1.5rem, 4vw, 2rem);
        letter-spacing: -0.025em;
      }

      .no-script__grid {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        margin: 0;
        padding: 0;
        gap: 1rem;
        list-style: none;
      }

      .no-script__grid--four {
        grid-template-columns: repeat(4, minmax(0, 1fr));
      }

      .no-script__grid li {
        min-width: 0;
        padding: 1.1rem;
        border: 1px solid rgba(79, 88, 131, 0.1);
        border-radius: 1rem;
        background: rgba(255, 255, 255, 0.82);
        box-shadow: 0 1rem 2.5rem rgba(35, 43, 84, 0.06);
      }

      .no-script h3 {
        margin-bottom: 0.35rem;
        color: #111b3d;
        font-size: 1rem;
      }

      .no-script__grid p {
        margin-bottom: 0;
        font-size: 0.875rem;
      }

      .no-script__footer {
        display: flex;
        flex-wrap: wrap;
        justify-content: space-between;
        padding-block: 2rem;
        gap: 0.75rem 2rem;
        border-top: 1px solid rgba(13, 22, 56, 0.1);
        font-size: 0.8rem;
      }

      .no-script__contact {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem 1.25rem;
        font-style: normal;
      }

      @media (max-width: 768px) {
        .no-script__header,
        .no-script__main,
        .no-script__footer {
          width: min(calc(100% - 2rem), 32rem);
        }

        .no-script__header {
          align-items: flex-start;
          flex-direction: column;
          gap: 0.1rem;
        }

        .no-script__hero {
          padding-block: 4rem;
        }

        .no-script__grid,
        .no-script__grid--four {
          grid-template-columns: minmax(0, 1fr);
        }

        .no-script__footer {
          flex-direction: column;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <div class="no-script">
        <header class="no-script__header">
          <span class="no-script__brand">问答光源 | AskLume</span>
          <span class="no-script__subtitle">企业AI认知与影响力基础设施</span>
        </header>

        <main class="no-script__main">
          <section aria-labelledby="no-script-hero" class="no-script__hero">
            <p class="no-script__eyebrow">GEO-AIP™ 数字证据工程</p>
            <h1 id="no-script-hero">让品牌被AI看见、理解与选择。</h1>
            <p class="no-script__description">
              问答光源通过 GEO-AIP™ 数字证据工程，帮助企业把真实能力转化为 AI
              可发现、可理解、可检验、可引用的认知资产。
            </p>
          </section>

          <section aria-labelledby="no-script-benefits" class="no-script__section">
            <h2 id="no-script-benefits">为什么选择问答光源</h2>
            <ul class="no-script__grid">
              <li><h3>更高的AI可见性</h3><p>让企业在更多AI平台中被主动发现与识别</p></li>
              <li><h3>更准确的AI理解</h3><p>让AI正确理解企业是谁、能做什么、适合谁</p></li>
              <li><h3>更强的品牌选择力</h3><p>为企业进入AI推荐与决策结果提供可信基础</p></li>
            </ul>
          </section>

          <section aria-labelledby="no-script-pillars" class="no-script__section">
            <h2 id="no-script-pillars">三大信息支柱 · 构建AI认知基线</h2>
            <ul class="no-script__grid">
              <li><h3>被看见</h3><p>提升AI发现与识别能力</p></li>
              <li><h3>被理解</h3><p>确保AI准确理解企业能力</p></li>
              <li><h3>被选择</h3><p>赢得AI推荐与决策信任</p></li>
            </ul>
          </section>

          <section aria-labelledby="no-script-capabilities" class="no-script__section">
            <h2 id="no-script-capabilities">从数据到决策的完整能力体系</h2>
            <ul class="no-script__grid no-script__grid--four">
              <li><h3>AI搜索与洞察</h3><p>追踪品牌在主流AI平台中的表现、发现问题、洞察机会。</p></li>
              <li><h3>持续监测与预警</h3><p>实时监测AI回答变化、识别风险信号、助力品牌管理。</p></li>
              <li><h3>企业协同与资产管理</h3><p>跨团队、跨系统协作，沉淀企业资产、提升组织生产力。</p></li>
              <li><h3>定制化智能方案</h3><p>根据行业与业务特点定制方案，匹配企业独特需求。</p></li>
            </ul>
          </section>
        </main>

        <footer class="no-script__footer">
          <address class="no-script__contact">
            <a href="tel:400-888-8888">400-888-8888</a>
            <a href="mailto:hello@asklume.com">hello@asklume.com</a>
          </address>
          <span>© 2024 问答光源科技：保留所有权利</span>
        </footer>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
